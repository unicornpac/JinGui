name: 测试与覆盖率

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 环境诊断
        run: |
          echo "=== Python ===" && python --version
          echo "=== pwd ===" && pwd
          echo "=== alembic.ini ===" && ls -la ../alembic.ini 2>/dev/null || echo "NOT FOUND"
          echo "=== alembic 包 ===" && python -c "import alembic; print(alembic.__version__)" 2>&1
          echo "=== 应用导入 ===" && python -c "from app.main import app; print('OK')" 2>&1

      - name: 运行测试
        run: python -m pytest tests/ --cov --cov-report=term-missing --tb=short -q

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7
