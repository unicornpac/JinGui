services:
  - type: web
    name: jingui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    rootDir: backend
    disk:
      name: jingui-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATA_DIR
        value: /var/data
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-chat
